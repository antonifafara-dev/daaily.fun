const SOUND_KEY='dailyFunSounds';const soundToggle=document.querySelector('#soundToggle');let soundsEnabled=true;try{soundsEnabled=localStorage.getItem(SOUND_KEY)!=='false'}catch{}function syncSoundToggle(){soundToggle.setAttribute('aria-pressed',String(soundsEnabled));soundToggle.setAttribute('aria-label',soundsEnabled?'Wyłącz dźwięki':'Włącz dźwięki')}syncSoundToggle();let uiAudio=null;function playBubbleSound(index){if(!soundsEnabled)return;try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;uiAudio??=new AC();if(uiAudio.state==='suspended')uiAudio.resume();const now=uiAudio.currentTime,frequency=430+(index%5)*58,osc=uiAudio.createOscillator(),gain=uiAudio.createGain();osc.type='sine';osc.frequency.setValueAtTime(frequency,now);osc.frequency.exponentialRampToValueAtTime(frequency*1.48,now+.045);osc.frequency.exponentialRampToValueAtTime(frequency*.62,now+.16);gain.gain.setValueAtTime(.0001,now);gain.gain.exponentialRampToValueAtTime(.022,now+.01);gain.gain.exponentialRampToValueAtTime(.0001,now+.18);osc.connect(gain);gain.connect(uiAudio.destination);osc.start(now);osc.stop(now+.19)}catch{}}function playUiSound(kind='click'){if(!soundsEnabled)return;try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;uiAudio??=new AC();if(uiAudio.state==='suspended')uiAudio.resume();const now=uiAudio.currentTime;const notes=kind==='theme'?[560,740]:kind==='toggle'?[660]:[430];notes.forEach((frequency,index)=>{const start=now+index*.055,osc=uiAudio.createOscillator(),gain=uiAudio.createGain();osc.type='sine';osc.frequency.setValueAtTime(frequency,start);osc.frequency.exponentialRampToValueAtTime(frequency*.78,start+.17);gain.gain.setValueAtTime(.0001,start);gain.gain.exponentialRampToValueAtTime(kind==='theme'?.027:.02,start+.012);gain.gain.exponentialRampToValueAtTime(.0001,start+.2);osc.connect(gain);gain.connect(uiAudio.destination);osc.start(start);osc.stop(start+.21)})}catch{}}soundToggle.addEventListener('click',()=>{soundsEnabled= const THEME_KEY='dailyFunTheme';
const themeDots=[...document.querySelectorAll('.theme-dot')];
function applyTheme(theme){const valid=['light','dark','halloween'].includes(theme)?theme:'light';document.documentElement.dataset.theme=valid;themeDots.forEach(dot=>dot.setAttribute('aria-pressed',String(dot.dataset.themeChoice===valid)));try{localStorage.setItem(THEME_KEY,valid)}catch{}const colors={light:'#f6efe5',dark:'#2b211d',halloween:'#211b26'};document.querySelector('meta[name=theme-color]').content=colors[valid]}
let savedTheme='light';try{savedTheme=localStorage.getItem(THEME_KEY)||'light'}catch{}applyTheme(savedTheme);themeDots.forEach(dot=>dot.addEventListener('click',()=>applyTheme(dot.dataset.themeChoice)));
const gamesEl=document.querySelector('#games');
gamesEl.innerHTML=categories.map(category=>`<section class="game-section"><h2 class="section-title">${category.title}</h2><div class="grid">${category.items.map(g=>`<a class="tile" href="${g.url}" target="_blank" rel="noopener noreferrer" data-game="${g.name}" aria-label="Otwórz ${g.name} w nowej karcie"><img class="art" src="${g.image}" alt="${g.name}" loading="lazy"><span class="label"><span class="game-title">${g.name}</span><span class="game-streak" data-streak-for="${g.name}" hidden></span></span></a>`).join('')}</div></section>`).join('');
document.querySelector('#date').textContent=new Date().toLocaleDateString('pl-PL',{weekday:'long',day:'numeric',month:'long'});

let authMode='register',authUser=null,csrfToken='',gameStreaks={},apiReady=false,authMessage='';
function escapeHtml(value){return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function drawGameStreaks(){document.querySelectorAll('.game-streak').forEach(el=>{if(!authUser){el.hidden=true;el.textContent='';return}const n=gameStreaks[el.dataset.streakFor]||0;el.hidden=false;el.textContent=`🔥 ${n}`;el.title=`Seria tej gry: ${n} ${n===1?'dzień':'dni'}`})}
function drawProfile(message=authMessage){const box=document.querySelector('#profile');if(authUser){box.innerHTML=`<div class="profile-on"><span class="profile-name">${escapeHtml(authUser.username)}</span><span class="profile-hint">zalogowano · serie przy grach</span></div><button type="button" id="logout">Wyloguj</button>`;box.querySelector('#logout').addEventListener('click',logout)}else{const registering=authMode==='register';box.innerHTML=`<form class="auth-form" id="authForm"><div class="auth-fields"><input name="username" maxlength="24" minlength="2" placeholder="Login" aria-label="Login" autocomplete="username" required><input name="password" type="password" minlength="8" maxlength="200" placeholder="Hasło" aria-label="Hasło" autocomplete="${registering?'new-password':'current-password'}" required></div><button class="auth-submit" type="submit" ${apiReady?'':'disabled'}>${registering?'Zarejestruj':'Zaloguj'}</button><button class="auth-mode" id="authModeToggle" type="button">${registering?'Mam konto':'Utwórz konto'}</button><span class="profile-hint auth-message">${escapeHtml(message|| (apiReady?(registering?'Załóż konto, aby zapisywać serie':'Zaloguj się, aby zapisywać serie'):'Łączę z bazą kont…'))}</span></form>`;box.querySelector('#authForm').addEventListener('submit',submitAuth);box.querySelector('#authModeToggle').addEventListener('click',()=>{authMode=authMode==='register'?'login':'register';authMessage='';drawProfile()})}drawGameStreaks()}
async function apiRequest(action,data=null){const options={method:data?'POST':'GET',credentials:'same-origin',headers:{'Accept':'application/json'}};if(data){options.headers['Content-Type']='application/json';options.headers['X-CSRF-Token']=csrfToken;options.body=JSON.stringify(data)}const response=await fetch(`api.php?action=${encodeURIComponent(action)}`,options);const payload=await response.json();if(!response.ok)throw new Error(payload.error||'Wystąpił błąd.');return payload}
async function initializeAuth(){try{const data=await apiRequest('me');csrfToken=data.csrf;authUser=data.user;gameStreaks=data.streaks||{};apiReady=true;authMessage='';drawProfile()}catch{apiReady=false;authMessage='Uruchom run-local.bat, aby włączyć konta i bazę SQLite.';drawProfile()}}
async function submitAuth(event){event.preventDefault();if(!apiReady)return;const form=event.currentTarget,values=new FormData(form),username=String(values.get('username')||'').trim(),password=String(values.get('password')||'');try{const data=await apiRequest(authMode,{username,password});csrfToken=data.csrf;authUser=data.user;gameStreaks=data.streaks||{};authMessage='';drawProfile()}catch(error){authMessage=error.message;drawProfile(authMessage)}}
async function logout(){try{const data=await apiRequest('logout',{});csrfToken=data.csrf;authUser=null;gameStreaks={};authMessage='';drawProfile()}catch(error){authMessage=error.message;drawProfile(authMessage)}}
async function recordGame(gameId){if(!authUser){authMessage='Zaloguj się, aby zapisywać serię dla każdej gry.';drawProfile(authMessage);return}try{const data=await apiRequest('play',{game_id:gameId});gameStreaks=data.streaks||gameStreaks;drawGameStreaks()}catch(error){authMessage=error.message;drawProfile(authMessage)}}
drawProfile('Łączę z bazą kont…');initializeAuth();
gamesEl.addEventListener('click',event=>{const tile=event.target.closest('.tile');if(tile)recordGame(tile.dataset.game)});
const mascot=document.querySelector('#mascot');
let orbitAngle=null,orbitSum=0,orbitStart=0,dizzyUntil=0;
function lookAtPointer(event){
  const rect=mascot.getBoundingClientRect(),cx=rect.left+rect.width/2,cy=rect.top+rect.height/2;
  const dx=event.clientX-cx,dy=event.clientY-cy,distance=Math.hypot(dx,dy)||1;
  const reach=Math.min(1,1/distance),mx=dx*reach*7,my=dy*reach*6;
  if(!mascot.classList.contains('dizzy')){
    document.getElementById('leftPupil').setAttribute('transform','translate('+mx+' '+my+')');
    document.getElementById('rightPupil').setAttribute('transform','translate('+mx+' '+my+')');
  }
  const now=performance.now(),radius=Math.hypot(dx,dy);
  if(radius>24&&radius<Math.max(rect.width,rect.height)*3){
    const angle=Math.atan2(dy,dx);
    if(orbitAngle!==null&&now-orbitStart<1600){
      let delta=angle-orbitAngle;
      while(delta>Math.PI)delta-=Math.PI*2;
      while(delta< -Math.PI)delta+=Math.PI*2;
      if(Math.abs(delta)<1.25)orbitSum+=Math.abs(delta);else orbitSum=0;
    }else{orbitSum=0;orbitStart=now}
    if(orbitSum>=Math.PI*2&&now>dizzyUntil){
      mascot.classList.remove('dizzy');void mascot.getBoundingClientRect();mascot.classList.add('dizzy');
      dizzyUntil=now+2200;orbitSum=0;orbitStart=now;
    }else if(orbitSum===0)orbitStart=now;
    orbitAngle=angle;
  }else{orbitAngle=null;orbitSum=0}
  if(orbitAngle!==null&&now-orbitStart>1600){orbitAngle=null;orbitSum=0}
}
mascot.addEventListener('animationend',event=>{if(event.animationName==='head-dizzy')mascot.classList.remove('dizzy')});
document.addEventListener('pointermove',lookAtPointer,{passive:true});
const weatherEl=document.querySelector('#weather');
const weatherText=code=>code===0?'bezchmurnie':code<=3?'pochmurno':code<50?'mgła':code<60?'mżawka':code<70?'deszcz':code<80?'śnieg':code<90?'przelotne opady':'burza';
async function getWeather(lat,lon){const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code&timezone=auto`);if(!r.ok)throw Error('weather');const d=await r.json();weatherEl.textContent=`Pogoda: ${Math.round(d.current.temperature_2m)}°C · ${weatherText(d.current.weather_code)}`}
function detectWeather(){if(!navigator.geolocation){weatherEl.textContent='Pogoda: lokalizacja niedostępna';return}weatherEl.textContent='Pogoda: wykrywam lokalizację…';navigator.geolocation.getCurrentPosition(async p=>{try{await getWeather(p.coords.latitude,p.coords.longitude)}catch{weatherEl.textContent='Pogoda: nie udało się pobrać danych'}},()=>{weatherEl.textContent='Pogoda: zezwól przeglądarce na lokalizację'}, {enableHighAccuracy:false,timeout:12000,maximumAge:600000})}
weatherEl.addEventListener('click',detectWeather);detectWeather();
</script></body></html>
